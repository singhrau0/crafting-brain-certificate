services:
  - type: web
    name: crafting-brain-certificates
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 2 --timeout 180 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /login
    disk:
      name: certificate-records
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/certificates.sqlite3
